# Render.com blueprint for the EventBook API (must live at the repo root).
# Render -> New -> Blueprint -> pick this repo. Set DATABASE_URL and
# FRONTEND_ORIGIN in the dashboard when prompted (sync: false below).
services:
  - type: web
    name: eventbook-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
